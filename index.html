<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- webdashers.io community config: same-origin when served from the site,
         absolute production URLs when hosted on GitHub Pages (cross-origin). -->
    <script>
        (function () {
            var h = location.hostname;
            var local = h === "localhost" || h === "127.0.0.1" || h === "webdashers.io" || h.endsWith(".webdashers.io");
            window.WD_API_BASE = local ? "/api" : "https://webdashers.io/api";
            window.WD_GD_API_BASE = local ? "/api/gd" : "https://webdashers.io/api/gd";
        })();
        // Neutralize the game's localStorage cache (5MB quota, stores stale data
        // from previous asset generations and hangs the loader on bad hits).
        // The browser HTTP cache (immutable assets) fully replaces it.
        (function () {
            try {
                var kill = [];
                for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k && (k.indexOf("webdash_cache_") === 0 || k === "webdash_cache_version" || k === "webdash_assets_loaded" || k === "webdash_last_load_time")) kill.push(k);
                }
                for (var j = 0; j < kill.length; j++) localStorage.removeItem(kill[j]);
            } catch (e) {}
        })();
    </script>
    <!-- Independent stall guard: runs straight from the HTML, before/without any
         game script. If nothing renders within 40s (a hung script/asset request),
         show diagnostics with loaded-bytes and retry once. -->
    <script>
        (function () {
            function fmtMB(b) { return (b / 1048576).toFixed(1) + " MB"; }
            function netStats() {
                var res = performance.getEntriesByType("resource");
                var bytes = 0, count = 0;
                for (var i = 0; i < res.length; i++) {
                    if (res[i].transferSize) { bytes += res[i].transferSize; count++; }
                }
                return count + " files / " + fmtMB(bytes) + " loaded";
            }
            function banner(t) {
                var b = document.getElementById("wd-stall-info");
                if (!b) {
                    b = document.createElement("div");
                    b.id = "wd-stall-info";
                    b.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:2147483647;background:#7f1d1d;color:#fecaca;font:13px/1.6 monospace;padding:8px 12px;text-align:center";
                    (document.body || document.documentElement).appendChild(b);
                }
                b.textContent = t;
            }
            setTimeout(function () {
                var canvas = document.querySelector("canvas");
                if (canvas) return; // game engine started; game JS handles the rest
                // rotate to the next mirror: same game, different CDN
                var mirrors = [
                    "https://eatmore.github.io/webdashers-game/",
                    "https://cdn.jsdelivr.net/gh/eatmore/webdashers-game@main/",
                    "https://webdashers.io/game/"
                ];
                var tried = parseInt(sessionStorage.getItem("wd-mirror") || "0", 10);
                var next = tried + 1;
                if (next < mirrors.length) {
                    banner("This mirror is slow (" + netStats() + ") — switching to backup " + next + "...");
                    sessionStorage.setItem("wd-mirror", String(next));
                    location.replace(mirrors[next] + "index.html" + location.search);
                } else {
                    banner("All mirrors failed on your connection. " + netStats() + " — try again later or use a different network");
                }
            }, 40000);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Web Dashers</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=d31d2d9717">
    <link rel="stylesheet" href="assets/style.css?v=d31d2d9717">
    <style>
        /* Instant boot screen: visible before any JS runs, removed by loading-screen.js
           once Phaser has taken over rendering. */
        #boot-loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            background: #101014;
            z-index: 2147483647;
            font-family: Arial, sans-serif;
        }
        .boot-cube {
            width: 48px;
            height: 48px;
            background: #C1FB3D;
            border-radius: 6px;
            animation: boot-bounce 0.6s cubic-bezier(0.2, 0, 0.4, 1) infinite alternate;
        }
        @keyframes boot-bounce {
            from { transform: translateY(0) rotate(0deg); }
            to   { transform: translateY(-28px) rotate(90deg); }
        }
        .boot-text {
            color: #C1FB3D;
            font-size: 14px;
            letter-spacing: 2px;
            margin: 0;
        }
        @media (prefers-reduced-motion: reduce) {
            .boot-cube { animation: none; }
        }
    </style>
    <meta name="description" content="Web Dashers is a fan-made browser mod of the Geometry Dash Web Demo. It features the main levels, a built-in level creator, and a level search to play online levels. The project is actively in development, with more features and updates planned.">

    <script>
        new ResizeObserver(() => {
            window.dispatchEvent(new Event('resize'));
        }).observe(document.documentElement);

        document.oncontextmenu = (event) => {
            event.preventDefault();
        };
    </script>
</head>

<body>
    <div id="boot-loading" aria-label="Loading Web Dashers">
        <div class="boot-cube"></div>
        <p class="boot-text">LOADING</p>
        <p class="boot-sub" style="color:#71717a;font-size:11px;letter-spacing:0;margin:0">First load downloads the game (~14&nbsp;MB) — after this one time, it opens instantly.</p>
